[package]
name = "leetcode-cli"
version = "0.1.0"
authors = ["Coding Kelps"]
categories = ["command-line-utilities"]
description = "Interact with LeetCode in your development environment."
edition = "2021"
exclude = []
homepage = "https://github.com/coding-kelps/leetcode-cli"
keywords = ["leetcode", "cli", "terminal", "coding-interview"]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/coding-kelps/leetcode-cli"
rust-version = "1.83"

[[bin]]
name = "leetcode-cli"
path = "src/main.rs"

[lib]
name = "leetcode_cli"
path = "src/lib.rs"

[dependencies]
leetcoderustapi = "1.0.8"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.6"
toml_edit = "0.25.15"
serde = { version = "1.0.229", features = ["serde_derive"] }
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
dirs = "7.0.0"
warp = "0.4.3"
colored = "3.1.1"
nanohtml2text = "0.3.0"
html2md = "0.2.17"
tempfile = "3.27.0"
regex = "1.13.1"
thiserror = "2.0.21"
spinners = "4.2.0"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
serde_json = "1.0.151"
